<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Music Playlists</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/music-playlists}">MusicPlaylist</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" th:href="@{/songs}">Songs</a>
        </div>
    </div>
</nav>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="mb-0">Music Playlists</h1>
        <a class="btn btn-primary" th:href="@{/music-playlists/create}">Create Playlist</a>
    </div>

    <form class="row g-3 align-items-center mb-4" method="get" th:action="@{/music-playlists}">
        <div class="col-md-10">
            <input type="text" class="form-control form-control-lg" name="musicPlaylistName"
                   th:value="${musicPlaylistName}" placeholder="Search playlists by name">
        </div>
        <div class="col-md-2 d-grid">
            <button type="submit" class="btn btn-outline-primary btn-lg">Search</button>
        </div>
    </form>

    <div th:if="${#lists.isEmpty(musicPlaylists)}" class="alert alert-info" role="alert">
        No playlists found.
    </div>

    <div th:unless="${#lists.isEmpty(musicPlaylists)}" class="row row-cols-1 row-cols-lg-2 g-4">
        <div class="col" th:each="playlist : ${musicPlaylists}">
            <div class="card h-100 shadow-sm border-0">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <h5 class="card-title mb-0" th:text="${playlist.PlaylistName().value()}">Playlist Name</h5>
                        <span class="badge text-bg-primary" th:text="${playlist.UserId()}">User</span>
                    </div>

                    <p class="card-text text-muted mb-3" th:text="${playlist.Description().value()}">Playlist description</p>

                    <div class="small text-secondary">
                        <span class="fw-semibold">Song:</span>
                        <span th:if="${playlist.Songs() != null}">
                            <span th:text="${playlist.Songs().Title().value()}">Song title</span>
                            <span class="text-muted">-</span>
                            <span th:text="${playlist.Songs().Artist().value()}">Artist</span>
                        </span>
                    </div>
                </div>

                <div class="card-footer bg-white border-0 d-flex gap-2">
                    <a class="btn btn-sm btn-outline-primary"
                       th:href="@{/music-playlists/{id}/edit(id=${playlist.getId()})}">Edit</a>
                    <form th:action="@{/music-playlists/{id}/delete(id=${playlist.getId()})}" method="post">
                        <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
