<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Songs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/music-playlists}">MusicPlaylist</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" th:href="@{/songs}">Songs</a>
        </div>
    </div>
</nav>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="mb-0">Songs</h1>
        <a class="btn btn-primary" th:href="@{/songs/create}">Add Song</a>
    </div>

    <div th:if="${#lists.isEmpty(songs)}" class="alert alert-info" role="alert">
        No songs available yet.
    </div>

    <div th:unless="${#lists.isEmpty(songs)}" class="row row-cols-1 row-cols-lg-2 g-4">
        <div class="col" th:each="song : ${songs}">
            <div class="card h-100 shadow-sm border-0">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-start">
                        <div>
                            <h5 class="card-title mb-1" th:text="${song.Title().value()}">Song title</h5>
                            <p class="card-text text-muted mb-0" th:text="${song.Artist().value()}">Artist</p>
                        </div>
                        <span class="badge text-bg-secondary" th:text="${song.Year().value()}">Year</span>
                    </div>
                    <p class="card-text mt-3 mb-0">
                        <strong>Album:</strong> <span th:text="${song.Album().value()}">Album</span>
                    </p>
                </div>
                <div class="card-footer bg-white border-0 d-flex gap-2">
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/songs/{id}/edit(id=${song.getId()})}">Edit</a>
                    <form th:action="@{/songs/{id}/delete(id=${song.getId()})}" method="post">
                        <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
