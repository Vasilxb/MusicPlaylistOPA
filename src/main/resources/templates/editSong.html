<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Song</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/music-playlists}">MusicPlaylist</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" th:href="@{/songs}">Songs</a>
        </div>
    </div>
</nav>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <h2 class="mb-4">Edit Song</h2>

                    <form method="post" th:action="@{/songs/{id}/update(id=${song.getId()})}">
                        <div class="mb-3">
                            <label for="title" class="form-label">Title</label>
                            <input id="title" name="title" type="text" class="form-control"
                                   th:value="${song.Title().value()}" required>
                        </div>

                        <div class="mb-3">
                            <label for="artist" class="form-label">Artist</label>
                            <input id="artist" name="artist" type="text" class="form-control"
                                   th:value="${song.Artist().value()}" required>
                        </div>

                        <div class="mb-3">
                            <label for="album" class="form-label">Album</label>
                            <input id="album" name="album" type="text" class="form-control"
                                   th:value="${song.Album().value()}" required>
                        </div>

                        <div class="mb-4">
                            <label for="year" class="form-label">Year</label>
                            <input id="year" name="year" type="text" class="form-control" maxlength="4" pattern="\\d{4}"
                                   th:value="${song.Year().value()}" required>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a class="btn btn-outline-secondary" th:href="@{/songs}">Cancel</a>
                            <button type="submit" class="btn btn-primary">Update Song</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
