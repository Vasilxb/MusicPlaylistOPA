<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Playlist</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/music-playlists}">MusicPlaylist</a>
    </div>
</nav>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4 p-lg-5">
                    <h2 class="mb-4">Edit Playlist</h2>

                    <form method="post" th:action="@{/music-playlists/{id}/update(id=${playlist.getId()})}">
                        <div class="mb-3">
                            <label for="playlistName" class="form-label">Playlist name</label>
                            <input id="playlistName" name="playlistName" type="text" class="form-control"
                                   th:value="${playlist.PlaylistName().value()}" required>
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label">Description</label>
                            <textarea id="description" name="description" class="form-control" rows="3" required
                                      th:text="${playlist.Description().value()}"></textarea>
                        </div>

                        <div class="mb-3">
                            <label for="userId" class="form-label">User ID</label>
                            <input id="userId" name="userId" type="text" class="form-control"
                                   th:value="${playlist.UserId()}" required>
                        </div>

                        <div class="mb-4">
                            <label for="songId" class="form-label">Song</label>
                            <select id="songId" name="songId" class="form-select" required>
                                <option th:each="song : ${songs}"
                                        th:value="${song.getId()}"
                                        th:text="${song.Title().value() + ' - ' + song.Artist().value()}"
                                        th:selected="${playlist.Songs() != null and song.getId().equals(playlist.Songs().getId())}">
                                    Song
                                </option>
                            </select>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a class="btn btn-outline-secondary" th:href="@{/music-playlists}">Cancel</a>
                            <button type="submit" class="btn btn-primary">Update Playlist</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
